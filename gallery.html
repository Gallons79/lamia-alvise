<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery – Lamia Alvise</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="navbar-inner">

      <a href="index.html" class="logo-link">
        <img src="images/logo.svg" alt="Lamia Alvise logo" class="logo-img">
        <span class="logo-text">LAMIA • ALVISE</span>
      </a>

      <nav class="desktop-nav">
        <a href="house.html">Stay</a>
        <a href="surroundings.html">Explore</a>
        <a href="gallery.html" class="active">Gallery</a>
        <a href="contact.html">Contact</a>

        <div class="lang-toggle">
          <a href="gallery.html"><img src="images/flag-uk.svg" alt="English"></a>
          <a href="gallery-it.html"><img src="images/flag-it.svg" alt="Italiano"></a>
        </div>
      </nav>

      <button class="hamburger" id="hamburgerBtn">
        <span></span><span></span><span></span>
      </button>

      <nav class="mobile-nav" id="mobileNav">
        <a href="house.html">Stay</a>
        <a href="surroundings.html">Explore</a>
        <a href="gallery.html" class="active">Gallery</a>
        <a href="contact.html">Contact</a>

        <div class="lang-toggle">
          <a href="gallery.html"><img src="images/flag-uk.svg" alt="English"></a>
          <a href="gallery-it.html"><img src="images/flag-it.svg" alt="Italiano"></a>
        </div>
      </nav>

    </div>
  </header>

  <!-- HERO -->
  <section class="hero" style="background-image: url('images/gallery-hero.png'); height: 60vh;">
    <div class="hero-overlay"></div>
    <div class="hero-text">
      <h1>Gallery</h1>
      <p>A visual journey through Lamia Alvise</p>
    </div>
  </section>

  <!-- AUTO-GENERATED GALLERY -->
  <section style="
    max-width: 1200px;
    margin: 0 auto;
    padding: 60px 20px 80px;
  ">
    <div id="autoGallery" style="
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
    "></div>
  </section>

  <!-- FOOTER -->
  <footer>
    <p>© 2026 Lamia Alvise – Apulia, Italy</p>
  </footer>

  <!-- SCRIPT -->
  <script src="main.js"></script>

</body>
</html>
