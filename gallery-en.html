</head>

<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="navbar-inner">

      <a href="index-en.html" class="logo-link">
        <img src="images/logo.svg" alt="Lamia Alvise logo" class="logo-img">
        <span class="logo-text">LAMIA • ALVISE</span>
      </a>

      <nav class="desktop-nav">
        <a href="house-en.html">Stay</a>
        <a href="surroundings-en.html">Explore</a>
        <a href="gallery-enhtml" class="active">Gallery</a>
        <a href="contact-en.html">Contact</a>

        <div class="lang-toggle">
          <a href="gallery-it.html"><img src="images/flag-it.svg" alt="Italiano"></a>
        </div>
      </nav>

      <button class="hamburger" id="hamburgerBtn">
        <span></span><span></span><span></span>
      </button>

      <nav class="mobile-nav" id="mobileNav">
        <a href="house-en.html">Stay</a>
        <a href="surroundings-en.html">Explore</a>
        <a href="gallery-en.html" class="active">Gallery</a>
        <a href="contact-en.html">Contact</a>

          <a href="gallery-it.html"><img src="images/flag-it.svg" alt="Italiano"></a>
        </div>
      </nav>

    </div>
  </header>

  <!-- HERO -->
  <section class="hero" style="background-image: url('images/gallery-hero.webp'); height: 60vh;">
    <div class="hero-overlay"></div>
    <div class="hero-text">
      <h1>Gallery</h1>
      <p>A visual journey through Lamia Alvise</p>
    </div>
  </section>

  <!-- AUTO-GENERATED GALLERY -->
  <section style="
    max-width: 1200px;
    margin: 0 auto;
    padding: 60px 20px 80px;
  ">
    <div id="autoGallery" style="
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
    "></div>
  </section>

  <!-- FOOTER -->
  <footer>
    <div class="footer-social">
      <span class="footer-social-label">Follow us on</span>
      <a class="footer-social-icon" 
        href="https://www.instagram.com/lamia_alvise?igsh=MTlvbXBkZ3F4OTh2MQ%3D%3D&utm_source=qr"
        target="_blank" 
        rel="noopener noreferrer">

        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <rect x="2" y="2" width="20" height="20" rx="5"/>
          <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37Z"/>
          <!-- Puntino in alto a destra (corretto) -->
          <circle cx="17.5" cy="6.5" r="0.5"/>
        </svg>

    </div>

    <div class="footer-separator"></div>

    <p>© 2026 Lamia Alvise – Apulia, Italy</p>
    <p>CIS: BR07400291000077156 – CIN: IT074002C200125706</p>
