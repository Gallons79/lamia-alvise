<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact – Lamia Alvise</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="navbar">
    <div class="navbar-inner">
      <div class="logo">Lamia Alvise</div>
      <nav class="desktop-nav">
        <a href="index.html">Home</a>
        <a href="house.html">Stay</a>
        <a href="surroundings.html">Explore</a>
        <a href="contact.html" class="active">Contact</a>
      </nav>
      <button class="hamburger" id="hamburgerBtn">
        <span></span><span></span><span></span>
      </button>
    </div>
    <nav class="mobile-nav" id="mobileNav">
      <a href="index.html">Home</a>
      <a href="house.html">Stay</a>
      <a href="surroundings.html">Explore</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </header>

  <main class="page">
    <section class="page-hero">
      <h1>Contact & Booking</h1>
      <p>Tell us when you’d like to stay at Lamia Alvise.</p>
    </section>

    <section class="two-column">
      <form class="contact-form">
        <label>
          Name
          <input type="text" name="name" required />
        </label>
        <label>
          Email
          <input type="email" name="email" required />
        </label>
        <label>
          Dates
          <input type="text" name="dates" placeholder="e.g. 10–15 August" />
        </label>
        <label>
          Message
          <textarea name="message" rows="4"></textarea>
        </label>
        <button type="submit" class="cta">Send Request</button>
      </form>

      <div>
        <h2>Direct Contacts</h2>
        <p>Email: <a href="mailto:lamia.alvise@outlook.com">lamia.alvise@outlook.com</a></p>
        <p>Phone: +39 342 8012802</p>
        <h2>Location</h2>
        <p>Apulia, Italy – SP31, Carivigno (BR)</p>
        <!-- Google Maps Embed -->
        <div class="map-container">
            <iframe
                width="100%"
                height="300"
                style="border:0; border-radius: 8px;"
                loading="lazy"
                allowfullscreen
                referrerpolicy="no-referrer-when-downgrade"
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d756.6247276888927!2d17.663636469636476!3d40.66297491551521!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x13465d006f5c6859%3A0x572deff30bd23959!2sLamia%20Alvise!5e0!3m2!1sen!2sit!4v1779536045284!5m2!1sen!2sit" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
            </iframe>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2026 Lamia Alvise – Apulia, Italy</p>
  </footer>

  <script src="main.js"></script>
</body>
</html>
